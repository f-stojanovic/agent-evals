# Semantic threshold calibration set — THE PAIRS ONLY.
#
# The semantic scorer's default cutoff is 0.8, and it was invented. On the live
# suite it marks demonstrably correct summaries as below threshold, which is a
# statement about the constant rather than about the model. This set exists to
# replace the guess with a measurement, or to establish that it cannot be
# replaced, which is also a result.
#
# THERE ARE NO LABELS IN THIS FILE, DELIBERATELY.
#
# They live in evals/calibration-semantic-labels.yaml, and this file is the one
# an annotator reads. Until 2026-08-25 the labels sat here beside the texts,
# under ids that spelled them out and next to notes that restated them. Anyone
# asked to label this set would have been reading the answer key, and would
# have reproduced it. The ids are now opaque and carry no ordering: the file is
# not grouped by label, and the numbering does not alternate.
#
# The old ids are not repeated here, deliberately — naming even two of them
# would say which topics were positives. They are in the labels file, which is
# where answer key belongs, and a test fails if any of them reappears here.
#
# THIS IS NOT A BLIND STUDY AND DOES NOT CLAIM TO BE. The key is committed in
# the same repository and anyone determined can open it; a couple of the old
# ids also survive in src/calibrate-semantic.ts, where they explain why the
# split exists. What the split removes is ACCIDENTAL exposure — reading the
# answer while doing the task, which is what happened before and is how a
# labelling exercise reproduces the labels it was meant to check.
#
# WHAT AN ANNOTATOR IS ASKED. For each pair: reading the `reference` as the
# true summary of a support email, would you accept the `candidate` as a
# summary of that same email?
#
#   correct   — yes, a human reading it would accept it
#   incorrect — no
#
# One thing cannot be hidden and should not be: the README states publicly that
# the set is five correct and five incorrect, three of the negatives being
# fluent and confidently wrong. Knowing the composition is not knowing the
# assignment, but it does allow an annotator to force a 5/5 split. Do not.
# Label each pair on its own merits and let the totals fall where they fall —
# if they come out 6/4, that is a finding about the set and is worth more than
# a tidy number.
#
# Every entry declares who wrote its text (ADR 015). These were written by an
# assistant model, not by a person. Only the label may come from a human
# (ADR 021), and as of 2026-08-25 these ten labels are still generated and
# awaiting replacement.


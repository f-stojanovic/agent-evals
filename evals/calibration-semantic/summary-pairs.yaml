# Semantic threshold calibration set.
#
# The semantic scorer's default cutoff is 0.8, and it was invented. On the live
# suite it marks three demonstrably correct summaries — 0.54, 0.76, 0.79 — as
# below threshold, which is a statement about the constant rather than about the
# model. This set exists to replace the guess with a measurement, or to establish
# that it cannot be replaced, which is also a result.
#
# Each pair is a `candidate` summary judged against `reference` paraphrases, with
# a hand-assigned label:
#
#   correct   — a human reading it would accept it as a summary of that email
#   incorrect — a human would not
#
# The incorrect ones are deliberately NOT gibberish. Three of them are fluent,
# confident, on-topic, and factually wrong, because that is the failure a
# semantic scorer is least able to see and the one worth knowing the limits of.
# A calibration set of obviously-bad negatives reports a flattering separation
# and tells you nothing about the case you needed the number for.
#
# LABELS ARE ONE PASS BY ONE ANNOTATOR and are expected to be reviewed.

- id: sem-good-refund-01
  provenance: { kind: hand-authored, author: Filip Stojanović }
  label: correct
  note: Close paraphrase, different wording throughout.
  reference:
    - "A customer received a broken ceramic mug in order #48812 and wants a refund rather than a replacement."
  candidate: "Order #48812 arrived with a shattered mug; the customer is asking for their money back instead of a replacement."

- id: sem-good-outage-01
  provenance: { kind: hand-authored, author: Filip Stojanović }
  label: correct
  note: Correct, and much terser than the reference. Length asymmetry is normal.
  reference:
    - Northgate Retail's checkout API has been returning 503 for 40 minutes, costing about £4k an hour, and needs engineering escalation before a campaign launch.
  candidate: Checkout has been down for 40 minutes with 503 errors and needs urgent engineering escalation.

- id: sem-good-cancellation-01
  provenance: { kind: hand-authored, author: Filip Stojanović }
  label: correct
  note: Captures both the complaint and the cancellation enquiry.
  reference:
    - A long-running export bug has eroded the customer's trust and they are asking what the notice period and refund terms are on the annual plan.
  candidate: After months of a broken report export the customer has lost confidence and wants to know the notice period and whether they get money back mid-term.

- id: sem-good-billing-01
  provenance: { kind: hand-authored, author: Filip Stojanović }
  label: correct
  note: Correct, omitting the invoice number. Detail loss is not an error here.
  reference:
    - Priya Raman was charged twice for March against invoice LW-2291 and wants someone to check the duplicate charge.
  candidate: A customer was billed twice in March and would like the duplicate charge looked into.

- id: sem-good-terse-01
  provenance: { kind: hand-authored, author: Filip Stojanović }
  label: correct
  note: >
    Aggressively short but not wrong. Included because a threshold tuned only on
    verbose paraphrases will reject terse-but-correct output.
  reference:
    - "A customer received a broken ceramic mug in order #48812 and wants a refund rather than a replacement."
  candidate: Damaged item, refund requested.

- id: sem-wrong-fluent-action-01
  provenance: { kind: hand-authored, author: Filip Stojanović }
  label: incorrect
  note: >
    THE FLUENT LIE. Same topic, same register, opposite fact — the customer
    explicitly declined a replacement. A semantic scorer is close to blind here.
  reference:
    - "A customer received a broken ceramic mug in order #48812 and wants a refund rather than a replacement."
  candidate: "A customer received a broken ceramic mug in order #48812 and would like a replacement sent out."

- id: sem-wrong-fluent-severity-01
  provenance: { kind: hand-authored, author: Filip Stojanović }
  label: incorrect
  note: Fluent, on-topic, and wrong about the thing that decides the urgency field.
  reference:
    - Northgate Retail's checkout API has been returning 503 for 40 minutes, costing about £4k an hour, and needs engineering escalation before a campaign launch.
  candidate: Northgate Retail reported some intermittent slowness on the checkout API and asked whether it is worth investigating at some point.

- id: sem-wrong-fluent-entity-01
  provenance: { kind: hand-authored, author: Filip Stojanović }
  label: incorrect
  note: >
    Right shape, wrong customer and wrong invoice. The kind of error that
    survives review precisely because it reads well.
  reference:
    - Priya Raman was charged twice for March against invoice LW-2291 and wants someone to check the duplicate charge.
  candidate: Tom Weller was charged twice for April against invoice NG-4410 and wants someone to check the duplicate charge.

- id: sem-wrong-topic-01
  provenance: { kind: hand-authored, author: Filip Stojanović }
  label: incorrect
  note: Different support topic entirely. The easy negative; included as an anchor.
  reference:
    - "A customer received a broken ceramic mug in order #48812 and wants a refund rather than a replacement."
  candidate: The customer cannot log in and is asking for a password reset link.

- id: sem-wrong-empty-ish-01
  provenance: { kind: hand-authored, author: Filip Stojanović }
  label: incorrect
  note: >
    Says nothing. Included because a model that degrades to generic filler
    should not score as a near-match on generic support vocabulary.
  reference:
    - A long-running export bug has eroded the customer's trust and they are asking what the notice period and refund terms are on the annual plan.
  candidate: The customer sent an email about their account and would like a response from support.

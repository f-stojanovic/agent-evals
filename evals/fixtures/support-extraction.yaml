# Fixed subject outputs, replayed by the per-push CI run.
#
# RECORDED, not hand-authored — all five, as of 2026-08-20. Every entry below
# was captured verbatim from a live `claude-sonnet-5` run and carries a
# `provenance` field saying so. Two were hand-written for a few commits, while
# the cases existed but no live run had been paid for; they said so, the report
# printed the tally, and they have now been replaced.
#
# An earlier generation of this file WAS hand-authored while claiming otherwise
# in a comment — see ADR 015, which is why provenance is a required typed field
# rather than a sentence.
#
# Replaying real outputs lets the per-push gate prove the HARNESS works —
# sampling, extraction, every registered scorer, the baseline comparison, the
# exit code — without spending money, needing a secret, or returning a different
# answer each time. It does not prove the model still works; that is the
# scheduled live run's job (ADR 013).
#
# Re-record with: npm run eval, then copy the outputs out of .artifacts/run.json.

- caseId: cancellation-or-complaint-01
  provenance:
    kind: recorded
    model: claude-sonnet-5
    capturedAt: '2026-08-20'
  output:
    model: claude-sonnet-5
    inputTokens: 1061
    outputTokens: 195
    latencyMs: 4189
    toolCalls:
      - name: record_extraction
        input:
          intent: cancellation_request
          urgency: high
          customer_name: "A. Novak"
          requested_action: explain_cancellation_terms
          summary: "The customer is frustrated that the report export has been silently dropping rows for three months and wants to know the annual plan's notice period and refund policy for leaving mid-term."
  judge:
      - score: 0.85
        confidence: 0.75
        reason: "customer_name is exactly \"A. Novak\" (no fabrication), intent is the preferred `cancellation_request`, and requested_action is sensible. Only deviation is urgency \"high\" rather than the reviewed \"medium\", a minor disagreement on the least-weighted field."


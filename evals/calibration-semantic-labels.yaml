# Semantic calibration ANSWER KEY.
#
# Deliberately not in evals/calibration-semantic/. That directory is what an
# annotator opens, and until 2026-08-25 it contained the labels — under ids
# that spelled them out (`sem-good-refund-01`, `sem-wrong-topic-01`) beside
# notes like "THE FLUENT LIE" and "the easy negative". Anyone asked to label
# the set would have been reading this file's contents and reproducing them.
# The split is the fix: the texts are over there, the answers are here, and
# nothing joins them until load time.
#
# The loader requires exactly one label per pair and one pair per label, so a
# renamed or deleted pair is a load-time error rather than a silently
# unmeasured row.
#
# STATUS OF THESE LABELS: GENERATED, NOT HUMAN. Every one was written by an
# assistant model, which is the thing ADR 021 forbids — a model labelling a set
# that exists to measure a model. They are kept because deleting them would
# leave the scorer with no measurement at all, and because the negative result
# they produce (the groups do not separate) is the one finding a wrong label
# set is least likely to manufacture. They are queued for replacement by
# Filip Stojanović and `source` records which are which.
#
# TRACEABILITY. `wasId` is the original descriptive id and `wasNote` the
# original note, kept so the set's history is recoverable and so nobody has to
# trust that the renaming preserved the pairing. They live here rather than
# beside the texts because they are answer key too — `sem-wrong-fluent-action-01`
# states the label in its own name.

sem-p01:
  label: correct
  source: generated
  wasId: sem-good-refund-01
  wasNote: Close paraphrase, different wording throughout.

sem-p02:

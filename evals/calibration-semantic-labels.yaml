  source: generated
  negativeKind: fluent
  wasId: sem-wrong-fluent-action-01
  wasNote: >
    THE FLUENT LIE. Same topic, same register, opposite fact — the customer
    explicitly declined a replacement. A semantic scorer is close to blind here.


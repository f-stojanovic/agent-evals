# Subject under test: an agent that reads a customer support email and returns
# { intent, urgency, customer_name, requested_action } as structured data.
#
# `id` values here are permanent. See the note on EvalCase.id in src/types.ts:
# renaming one orphans its baseline history.

- id: refund-damaged-item-01
  description: >
    Unambiguous refund request. Every field is stated explicitly in the email,
    so any reasonable annotator produces the same answer. This is the case that
    should never regress — if it does, something is badly wrong.
  tags: [extraction, happy-path]
  weight: 1
  input:
    from: Maja Petrović <maja.petrovic@example.com>
    subject: "Order #48812 arrived broken"
    body: |
      Hi,

      My order #48812 arrived this morning and the ceramic mug was shattered
      inside the box. The packaging was clearly damaged in transit.

      I do not want a replacement — please refund the full amount to my card.

      Thanks,
      Maja Petrović
  expect:
    fields:
      intent: refund_request
      urgency: medium
      customer_name: Maja Petrović
      requested_action: issue_refund
    # Free text, so exact match is the wrong tool. Scored by meaning against
    # these alternatives, any one of which a human would accept.
    similar:
      - "A customer received a broken ceramic mug in order #48812 and wants a refund rather than a replacement."
      - Order arrived damaged in transit; the customer is asking for their money back, not a new item.
    # The subject is given a tool, so using it is the compliant path.
    format: tool-call

- id: outage-escalation-01
  description: >
    Explicit urgency signals (production down, revenue impact, a deadline) that
    the model must carry into the `urgency` field rather than defaulting to
    medium. Probes whether urgency is inferred from consequences, not keywords.
  tags: [extraction, urgency]
  weight: 2
  input:
    from: Tom Weller <t.weller@northgate-retail.example>
    subject: API returning 503 for all checkout calls
    body: |
      Our entire checkout has been down for 40 minutes. Every call to
      /v2/checkout returns 503. We are losing roughly £4k an hour and our
      Black Friday campaign goes live at 09:00 tomorrow.

      I need someone on this now. Escalate if you have to.

      Tom Weller
      Head of Engineering, Northgate Retail
  expect:
    fields:
      intent: technical_issue
      urgency: critical
      customer_name: Tom Weller
      requested_action: escalate_to_engineering
    similar:
      - Northgate Retail's checkout API has been returning 503 for 40 minutes, costing about £4k an hour, and needs engineering escalation before a campaign launch.
      - A production outage on the checkout endpoint is losing the customer revenue and they want it escalated urgently.
    format: tool-call

- id: billing-question-schema-01
  description: >
    A straightforward billing question, carried mainly to exercise
    `matchesSchema` against a real model. Every other scorer ships with a case
    that runs it; this one shipped registered and idle, which meant a scorer
    nobody had ever seen produce a number was being counted as working.

    The schema here is deliberately stricter than the enums alone: it also
    requires `summary` to be a non-empty string and forbids extra keys, which
    is the property `exactFields` cannot check because it only grades the
    fields a case happens to name.
  tags: [extraction, schema]
  input:
    from: Priya Raman <p.raman@lumen-works.example>
    subject: Charged twice for March?
    body: |
      Hi,

      I think I've been billed twice for March — there are two charges of
      £49 on the same day against invoice LW-2291. Could you check and let me
      know what's happened?

      Nothing urgent, I just don't want it to repeat in April.

      Priya Raman
  expect:
    fields:
      intent: billing_question
      urgency: low
      customer_name: Priya Raman
      requested_action: request_more_information
    schema:
      type: object
      required: [intent, urgency, customer_name, requested_action, summary]
      additionalProperties: false
      properties:
        intent: { enum: [refund_request, technical_issue, cancellation_request, complaint, billing_question] }
        urgency: { enum: [low, medium, high, critical] }
        customer_name: { type: string, minLength: 1 }
        requested_action:
          enum: [issue_refund, replace_item, escalate_to_engineering, explain_cancellation_terms, request_more_information, apologise]
        summary: { type: string, minLength: 1 }
    similar:
      - Priya Raman was charged twice for March against invoice LW-2291 and wants someone to check the duplicate charge.
      - A customer is asking about two identical £49 charges on the same invoice and whether it will happen again.
    format: tool-call

- id: no-tool-abuse-01
  description: >
    A one-line email that needs no lookup and no escalation. Carried to exercise
    `callsTool`, and it is a real assertion rather than a formality: the
    expectation is that the subject calls `record_extraction` EXACTLY ONCE and
    nothing else.

    Over-eager tool use is a standard agent failure mode — a model that reaches
    for a second tool on a trivial ticket costs latency and money on every
    request and is hard to notice, because the answer is still right. The
    `input` matcher is a subset match, so it asserts the call carried the right
    intent without pinning fields another scorer already grades.
  tags: [extraction, tool-use]
  input:
    from: Dan Okafor <d.okafor@example.net>
    subject: How long do refunds take?
    body: |
      Quick one — how long does a refund usually take to show up on a card
      once it's been approved? Not chasing anything, just planning ahead.

      Dan
  expect:
    fields:
      intent: billing_question
      urgency: low
      customer_name: Dan Okafor
      requested_action: request_more_information
    # A subset match on one field: it asserts the call carried the right
    # urgency without re-pinning the fields `exactFields` already grades.
    toolCalls:
      - name: record_extraction
        input:
          urgency: low
    similar:
      - Dan Okafor is asking how long an approved refund takes to appear on a card, with no urgency.
      - A customer wants to know the usual timescale for a refund to land, purely for planning.
    format: tool-call

# Judge calibration set.
#
# Each case pairs a FIXED subject output with a score a human assigned by hand.
# `npm run calibrate` runs the judge against these same outputs and reports how
# far it lands from the human labels.
#
# The outputs are fixed deliberately: if the subject were re-run, a changed
# score could mean the judge drifted or the subject did, and the measurement
# would be uninterpretable.
#
# WHO WROTE WHAT. The outputs, rubrics and descriptions below were written by an
# assistant model, not by a person. Until 2026-08-24 every case claimed
# `author: Filip Stojanović` in the field that exists to stop exactly that kind
# of false attribution (ADR 015, ADR 021). The `provenance.author` now names the
# actual writer.
#
# The `humanScore` labels ARE Filip Stojanović's, n=8, one annotator, assigned
# 2026-08-25, replacing the generated labels that preceded them. Every case
# carries `labelSource: human` so the claim is a field rather than a sentence in
# this header, and a test fails if any case says otherwise (ADR 021).
#
# That replacement moved the measured MAE by roughly a factor of three. The
# earlier figure was agreement between a model and its own answer key, on
# outputs the same model had written, with two rubrics that stated the target
# score outright — flattering in three separate ways at once, and published as
# accuracy.
#
# `labelKind` separates two things an error against a label can mean:
#   ground-truth — a competent annotator would land here; judge error is judge error
#   contested    — no ground truth exists; two annotators reading the same
#                  ambiguity land in different places, and the judge cannot be
#                  expected to agree with either
#
# The set spans the range on purpose — two clearly-right, two clearly-wrong,
# and several borderline. A calibration set of easy cases reports a flattering
# number that says nothing about the cases you needed a judge for in the first
# place. If the judge's MAE is low here but high on the borderline cases only,
# that is the finding, not a rounding error.
#
# RUBRICS STATE RULES, NEVER TARGETS. A rubric may say "deduct ~0.25 per wrong
# field", which applies to any output. It may not say "score this around 0.3",
# which applies only to the output in front of it and turns the judge's answer
# into instruction-following. Two rubrics here did exactly that until
# 2026-08-24; on cal-prose-not-json-01 the judge returned the stated number to
# the decimal.
#
# `humanReason` is the answer key and is never shown to the judge.

- id: cal-clear-correct-01
  provenance:
    kind: hand-authored
    author: Claude (Anthropic)
    note: >
      Output and rubric written by an assistant model to place this case at a
      chosen point on the score range. Not a person, and not captured from a
      model run. The humanScore beside it is NOT: that label is Filip
      Stojanović's, assigned 2026-08-25 and recorded as `labelSource: human`.
  description: Unambiguous extraction, every field right. The judge should be near 1.
  labelKind: ground-truth
  labelSource: human
  humanScore: 1.0
  humanReason: >
    Correct on all four fields, with nothing plausible-but-wrong anywhere in it.
    This is the case that has no judgement in it at all — if the judge scores it
    below 0.9 the judge is broken, not strict.
  expect:
    rubric: >
      The output must be a JSON object extracting {intent, urgency, customer_name,
      requested_action} from a support email in which Maja Petrović reports a mug
      that arrived shattered and explicitly asks for a refund rather than a
      replacement. Score 1.0 if all four fields are correct. Deduct roughly 0.25
      per field that is wrong or missing. Inventing a field value that is not
      supported by the email is worse than omitting it.
  output:
    model: subject-model-v1
    text: |
      {"intent":"refund_request","urgency":"medium","customer_name":"Maja Petrović","requested_action":"issue_refund"}

- id: cal-clear-wrong-01
  provenance:
    kind: hand-authored
    author: Claude (Anthropic)
    note: >
      Output and rubric written by an assistant model to place this case at a
      chosen point on the score range. Not a person, and not captured from a
      model run. The humanScore beside it is NOT: that label is Filip
      Stojanović's, assigned 2026-08-25 and recorded as `labelSource: human`.
  description: Confidently wrong on every field. The judge should be near 0.
  labelKind: ground-truth
  labelSource: human
  humanScore: 0.0
  humanReason: >
    The only correct thing about this output is that it is well-formed JSON, and
    format has its own scorer — the same rule that puts cal-prose-not-json-01 at
    0.9. Structure earns nothing here for the same reason its absence costs
    nothing there.

    Crediting it would also rank a confident fabrication above an honest
    refusal: cal-refused-01 extracts nothing and says so, this extracts nothing
    and hides it. That inverts the rule behind every other label in this set.

    Moved from an earlier 0.1 for those two reasons.
  expect:
    rubric: >
      The output must be a JSON object extracting {intent, urgency, customer_name,
      requested_action} from a support email in which Maja Petrović reports a mug
      that arrived shattered and explicitly asks for a refund rather than a
      replacement. Score 1.0 if all four fields are correct. Deduct roughly 0.25
      per field that is wrong or missing. Well-formed JSON with wrong contents
      earns no credit for being well formed — format is measured separately.
  output:
    model: subject-model-v1
    text: |
      {"intent":"technical_issue","urgency":"low","customer_name":"Tom Weller","requested_action":"escalate_to_engineering"}

- id: cal-partial-three-of-four-01
  provenance:
    kind: hand-authored
    author: Claude (Anthropic)
    note: >
      Output and rubric written by an assistant model to place this case at a
      chosen point on the score range. Not a person, and not captured from a
      model run. The humanScore beside it is NOT: that label is Filip
      Stojanović's, assigned 2026-08-25 and recorded as `labelSource: human`.
  description: Three fields right, urgency overstated. Anchors the middle of the range.
  labelKind: ground-truth
  labelSource: human
  humanScore: 0.6
  humanReason: >
    Deliberately below the arithmetic 0.75 that "one field of four" would give.
    The wrong field is urgency, and it is overstated: `critical` on a shattered
    mug puts a false alarm in front of whoever is triaging, which costs more
    than a missing value would. An arithmetic rubric prices every field the
    same; the consequences do not.
  expect:
    rubric: >
      The output must be a JSON object extracting {intent, urgency, customer_name,
      requested_action} from a support email in which Maja Petrović reports a mug
      that arrived shattered and explicitly asks for a refund. The correct urgency
      is medium: the customer is annoyed but nothing is time-critical. Score 1.0
      if all four fields are correct and deduct roughly 0.25 per field that is
      wrong or missing. An urgency that is too HIGH raises a false alarm for
      whoever triages the queue; deduct more for that than for one that is too
      low.
  output:
    model: subject-model-v1
    text: |
      {"intent":"refund_request","urgency":"critical","customer_name":"Maja Petrović","requested_action":"issue_refund"}

- id: cal-hallucinated-name-01
  provenance:
    kind: hand-authored
    author: Claude (Anthropic)
    note: >
      Output and rubric written by an assistant model to place this case at a
      chosen point on the score range. Not a person, and not captured from a
      model run. The humanScore beside it is NOT: that label is Filip
      Stojanović's, assigned 2026-08-25 and recorded as `labelSource: human`.
  description: >
    Invents a first name the email never contained. Tests whether the judge
    penalises fabrication harder than omission, as the rubric demands.
  labelKind: ground-truth
  labelSource: human
  humanScore: 0.25
  humanReason: >
    A fabricated name is the worst thing in this set. "Aleksandar Novak" reads
    like a real value, so it passes review; a blank field does not, because a
    blank field is visibly missing. Three correct fields do not buy that back,
    and scoring it at a plain 3-of-4 would price a fabrication as an ordinary
    miss.
  expect:
    rubric: >
      Extract {intent, urgency, customer_name, requested_action} from an email
      signed only "A. Novak". The correct customer_name is "A. Novak" — the first
      name is not available. Returning an invented first name is a fabrication and
      must be penalised MORE heavily than leaving the field null: a plausible
      invention survives downstream review, a blank does not. Score 1.0 for four
      correct fields, deduct ~0.25 per ordinary error, and deduct ~0.5 for a
      fabricated value.
  output:
    model: subject-model-v1
    text: |
      {"intent":"cancellation_request","urgency":"high","customer_name":"Aleksandar Novak","requested_action":"explain_cancellation_terms"}

- id: cal-borderline-intent-01
  provenance:
    kind: hand-authored
    author: Claude (Anthropic)
    note: >
      Output and rubric written by an assistant model to place this case at a
      chosen point on the score range. Not a person, and not captured from a
      model run. The humanScore beside it is NOT: that label is Filip
      Stojanović's, assigned 2026-08-25 and recorded as `labelSource: human`.
  description: >
    THE HARD ONE. The ambiguous case from evals/cases — a venting customer who
    asks about cancellation terms without asking to cancel. Two competent
    annotators disagree, so a high judge spread here is correct behaviour.
  labelKind: contested
  labelSource: human
  humanScore: 0.4
  humanReason: >
    Two of the four fields are the defensible reading rather than the right one,
    and defensible is not correct. An output can be argued for and still be the
    one you would not want recorded against the ticket.

    This case has no ground truth. The label is one annotator's line through an
    ambiguity a second annotator would draw elsewhere — the previous generated
    label put it at 0.6 on the same output — so judge error here is not evidence
    the judge is miscalibrated. It is marked `contested` for that reason and the
    report totals it separately.
  expect:
    rubric: >
      Extract {intent, urgency, customer_name, requested_action} from an email in
      which a customer complains about a broken export and then asks what the
      notice period is on the annual plan. The preferred intent is
      `cancellation_request`; `complaint` and `billing_question` are defensible
      alternatives. urgency `high` is preferred, `medium` is defensible.
      customer_name must be "A. Novak" exactly. Score 1.0 for four preferred
      values; deduct roughly 0.25 for a field that is wrong, and roughly half of
      that for a field that is defensible but not the preferred reading.
    acceptable:
      intent: [complaint, billing_question]
      urgency: [medium]
  output:
    model: subject-model-v1
    text: |
      {"intent":"complaint","urgency":"medium","customer_name":"A. Novak","requested_action":"explain_cancellation_terms"}

- id: cal-prose-not-json-01
  provenance:
    kind: hand-authored
    author: Claude (Anthropic)
    note: >
      Output and rubric written by an assistant model to place this case at a
      chosen point on the score range. Not a person, and not captured from a
      model run. The humanScore beside it is NOT: that label is Filip
      Stojanović's, assigned 2026-08-25 and recorded as `labelSource: human`.
  description: >
    Correct understanding, delivered as prose rather than JSON. Tests that the
    judge grades the content it was asked about and leaves the envelope to the
    scorer that measures envelopes.
  labelKind: ground-truth
  labelSource: human
  humanScore: 0.9
  humanReason: >
    The content is right: the refund request, the customer, the action and the
    urgency are all there and all correct. Format is a separate assertion,
    declared per case and measured by `formatCompliance` (ADR 019), so grading
    it again here would penalise the same defect twice and report one number
    that answers neither question. Not a full 1.0 only because the values have
    to be read out of a sentence rather than lifted from a field.
  expect:
    rubric: >
      Grade ONLY whether the content is correct: does the response identify the
      right intent, urgency, customer_name and requested_action for a support
      email in which Maja Petrović reports a shattered mug in order #48812 and
      explicitly asks for a refund rather than a replacement? The correct urgency
      is medium. Deduct roughly 0.25 per value that is wrong, missing, or not
      recoverable from the response.

      Do NOT grade the format. Whether the response is a JSON object, a tool
      call, or a paragraph is asserted separately by the case and measured by a
      different scorer. A correct answer written as prose is a correct answer.
  output:
    model: subject-model-v1
    text: >
      Maja Petrović is requesting a refund for order #48812 after receiving a
      shattered mug. She explicitly declined a replacement, so the action here is
      to issue a refund. I'd treat this as medium urgency.

- id: cal-tool-call-correct-01
  provenance:
    kind: hand-authored
    author: Claude (Anthropic)
    note: >
      Output and rubric written by an assistant model to place this case at a
      chosen point on the score range. Not a person, and not captured from a
      model run. The humanScore beside it is NOT: that label is Filip
      Stojanović's, assigned 2026-08-25 and recorded as `labelSource: human`.
  description: >
    Right answer delivered through a tool call rather than text. Checks that the
    judge does not penalise a compliant path it happens to see less often.
  labelKind: ground-truth
  labelSource: human
  humanScore: 1.0
  humanReason: >
    Every field is correct and the tool is the intended path. Scoring this below
    a text response carrying identical values would mean the judge is grading
    familiarity rather than quality.
  expect:
    rubric: >
      Extract {intent, urgency, customer_name, requested_action} from Maja
      Petrović's email about a shattered mug and an explicit refund request. The
      subject may answer either as JSON text or by calling the `record_extraction`
      tool — both are equally valid and neither should be preferred. Score 1.0 for
      four correct fields.
  output:
    model: subject-model-v1
    toolCalls:
      - name: record_extraction
        input:
          intent: refund_request
          urgency: medium
          customer_name: Maja Petrović
          requested_action: issue_refund

- id: cal-refused-01
  provenance:
    kind: hand-authored
    author: Claude (Anthropic)
    note: >
      Output and rubric written by an assistant model to place this case at a
      chosen point on the score range. Not a person, and not captured from a
      model run. The humanScore beside it is NOT: that label is Filip
      Stojanović's, assigned 2026-08-25 and recorded as `labelSource: human`.
  description: Model declined to answer. Should be near 0 without being treated as an error.
  labelKind: ground-truth
  labelSource: human
  humanScore: 0.0
  humanReason: >
    A refusal extracts nothing, so there is nothing to award. It is a legitimate
    model behaviour and a total failure at the task, and the two facts do not
    offset. A judge that credits the politeness of the hedge is scoring manner.
  expect:
    rubric: >
      Extract {intent, urgency, customer_name, requested_action} from a customer
      support email. A response that declines to perform the extraction, asks for
      clarification instead, or returns nothing usable scores 0 regardless of how
      reasonable the refusal sounds.
  output:
    model: subject-model-v1
    text: >
      I'm not able to determine the customer's intent from this email without more
      context about your product and support taxonomy. Could you clarify what
      categories you'd like me to use?
